function prepareCinema(){
 const box=document.getElementById('cinematicBreak'),w=innerWidth,h=innerHeight,ratio=(openingVideo.videoWidth||1920)/(openingVideo.videoHeight||1080),side=(w-Math.min(w,h*ratio))/2,cap=(h-Math.min(h,w/ratio))/2;
 cinematicFlowReady=false;box.replaceChildren();box.hidden=false;box.classList.remove('breaking');box.dataset.barWidth=side;box.dataset.barHeight=cap;
 const panels=[];if(side>.5)panels.push({x:0,y:0,w:side,h,axis:'x',dir:-1},{x:w-side,y:0,w:side,h,axis:'x',dir:1});if(cap>.5)panels.push({x:0,y:0,w,h:cap,axis:'y',dir:-1},{x:0,y:h-cap,w,h:cap,axis:'y',dir:1});
 for(const p of panels){const cols=p.axis==='x'?2:8,rows=p.axis==='x'?8:2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)for(let triangle=0;triangle<2;triangle++){
  const i=document.createElement('i'),x=p.x+c*p.w/cols,y=p.y+r*p.h/rows,cw=p.w/cols,ch=p.h/rows,seed=r*13+c*7+triangle*11,vertical=p.axis==='x',distance=vertical?Math.abs(y+ch/2-h/2)/h:Math.abs(x+cw/2-w/2)/w;
  i.className='cinematic-shard';i.style.cssText=`left:${x-.4}px;top:${y-.4}px;width:${cw+1}px;height:${ch+1}px;clip-path:polygon(${triangle?'0 0,100% 100%,0 100%':'0 0,100% 0,100% 100%'});--dx:${vertical?p.dir*(p.w+100+seed%5*30):(x-w/2)*.25}px;--dy:${vertical?(y-h/2)*.28:p.dir*(p.h+100+seed%5*30)}px;--spin:${(seed%13-6)*5}deg;--delay:${distance*.24+triangle*.02}s;`;box.appendChild(i);
 }}
 const canvas=document.createElement('canvas');canvas.id='electricDischarge';box.appendChild(canvas);
}
function beginLogoBurst(){
 cinematicBusy=true;const box=document.getElementById('cinematicBreak'),canvas=box.querySelector('canvas'),ctx=canvas.getContext('2d'),w=innerWidth,h=innerHeight,dpr=1,side=+box.dataset.barWidth,cap=+box.dataset.barHeight,cx=w/2,cy=h/2,r=Math.min(w,h)*.18,t0=performance.now(),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
 canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);
 const ends=cap>.5?[{x:cx,y:cap,angle:-Math.PI/2},{x:cx,y:h-cap,angle:Math.PI/2}]:[{x:Math.max(side,8),y:cy,angle:Math.PI},{x:w-Math.max(side,8),y:cy,angle:0}];
 const clamp=v=>Math.max(0,Math.min(1,v));
 const glow=document.createElement('canvas');glow.width=glow.height=192;const gc=glow.getContext('2d'),gradient=gc.createRadialGradient(96,96,0,96,96,96);gradient.addColorStop(0,'rgba(157,119,255,1)');gradient.addColorStop(.3,'rgba(123,66,255,.5)');gradient.addColorStop(1,'rgba(123,66,255,0)');gc.fillStyle=gradient;gc.fillRect(0,0,192,192);
 function haze(x,y,radius,alpha){ctx.globalAlpha=alpha;ctx.drawImage(glow,x-radius,y-radius,radius*2,radius*2);ctx.globalAlpha=1}
 function stroke(points,alpha,width){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#aa7fff';ctx.lineWidth=width*5;ctx.globalAlpha=alpha*.1;ctx.stroke();ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.stroke();ctx.strokeStyle='#fbf5ff';ctx.lineWidth=width*.35;ctx.stroke();ctx.globalAlpha=1}
 let broke=false;
 function frame(now){const t=(now-t0)/1000;ctx.clearRect(0,0,w,h);
  if(!reduced){
   const charge=clamp(t/.9)*clamp((1.65-t)/.5);haze(cx,cy,r*1.8,charge*.12);
   // Rotating broken coronas build charge without crossing the emblem.
   for(let j=0;j<3;j++){const a=t*(j%2?-1.2:1.1)+j*2.1,rr=r*(1+j*.08);ctx.beginPath();ctx.arc(cx,cy,rr,a,a+.8+j*.2);ctx.strokeStyle=j===1?'#d9caff':'#9872ff';ctx.lineWidth=1.2;ctx.globalAlpha=charge*.5;ctx.stroke()}ctx.globalAlpha=1;
   if(t>.85&&t<1.65){const progress=clamp((t-.85)/.36),fade=clamp((1.65-t)/.32);for(let e=0;e<ends.length;e++){const end=ends[e],sx=cx+Math.cos(end.angle)*r,sy=cy+Math.sin(end.angle)*r,points=[];
    for(let k=0;k<=Math.ceil(72*progress);k++){const p=Math.min(k/72,progress),amp=Math.sin(Math.PI*p),wave=Math.sin(p*13-t*11+e)*13+Math.sin(p*51+t*17)*3;points.push({x:sx+(end.x-sx)*p+(cap>.5?amp*wave:0),y:sy+(end.y-sy)*p+(cap>.5?0:amp*wave)})}
    stroke(points,fade*.85,1.8);const head=points.at(-1);if(head)haze(head.x,head.y,34,fade*.38);
   }}
   if(t>1.2&&t<2.35){const age=t-1.2,fade=clamp((2.35-t)/.65);for(let e=0;e<ends.length;e++){const end=ends[e];haze(end.x,end.y,120,fade*.23);
    for(let branch=0;branch<7;branch++){const points=[end],ang=branch*Math.PI*2/7+e*.2;for(let k=1;k<=6;k++){const dist=k*18;points.push({x:end.x+Math.cos(ang)*dist+Math.sin(k*7+branch)*8,y:end.y+Math.sin(ang)*dist+Math.cos(k*5+branch)*8})}stroke(points,fade*clamp(age*8)*.58,1)}
    for(let i=0;i<42;i++){const ang=i*2.399+e,v=35+i%7*15,p=age;ctx.globalAlpha=fade*clamp(1-p/1.1);ctx.fillStyle=i%3?'#a478ff':'#fff';ctx.beginPath();ctx.arc(end.x+Math.cos(ang)*v*p,end.y+Math.sin(ang)*v*p,Math.max(.3,1.8-p),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
   }}
  }
  if(t>1.7&&!cinematicFlowReady){cinematicFlowReady=true;dispatchEvent(new Event('cinema-flow-ready'))}
  if(t>1.32&&!broke){broke=true;box.classList.add('breaking')}
  if(t<(reduced?2:3.2))cinematicFrame=requestAnimationFrame(frame);else{cinematicBusy=false;box.hidden=true;box.replaceChildren();cinematicFrame=0;dispatchEvent(new Event('cinema-finished'))}
 }cinematicFrame=requestAnimationFrame(frame);
}

function finishOpeningVideo(){if(introDone||introFinishing)return;introFinishing=true;openingVideo.pause();prepareCinema();document.body.classList.remove('intro-active');openingVideoScene.classList.add('finishing');setTimeout(()=>{introDone=true;openingVideoScene.hidden=true;document.getElementById('presentationDeck').inert=false;state=1;render();syncHomeWork();beginLogoBurst();document.body.focus({preventScroll:true});setTimeout(()=>{const dispose=()=>{openingVideo.removeAttribute('src');openingVideo.load()};if(window.requestIdleCallback)requestIdleCallback(dispose,{timeout:1500});else dispose()},1800)},350)}

 function addLiveWires(source,layer,root){
  const oldTransform=source.style.transform;source.style.transform='none';

   const local=wire.getBBox(),matrix=root.getCTM().inverse().multiply(wire.getCTM());
