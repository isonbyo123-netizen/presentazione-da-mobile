<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0ff"><title>Presentazione da mobile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#342246;background:#f4f0ff}html{overflow:hidden;overscroll-behavior:none}body{position:fixed;left:var(--app-left,0px);top:var(--app-top,0px);width:var(--app-width,100%);height:100dvh;height:var(--app-height,100dvh);display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left));gap:10px}header strong{font-size:17px}header span{font-size:12px;color:#65537d}main{position:relative;flex:1;min-width:0;min-height:0;contain:strict;overflow:hidden;background:white}iframe{position:absolute;display:block;width:1440px;min-width:0;max-width:none;height:900px;border:0;transform-origin:0 0}footer{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:#f4f0ff}button{min-height:44px;padding:9px 16px;border:1px solid #c6b5ed;border-radius:12px;font:600 14px Arial;color:#503477;background:white;cursor:pointer;touch-action:manipulation}button.primary{background:#6f4dff;color:white;border-color:#6f4dff}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #00bebb;outline-offset:2px}@media(max-width:480px){header{flex-direction:column;gap:4px;align-items:flex-start}button{padding:9px 12px}}
body.landscape header{display:none}body.landscape main{flex:none;position:absolute;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)}body.landscape footer{position:absolute;z-index:2;left:50%;bottom:max(4px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:4px;gap:5px;border-radius:15px;background:#f4f0ffd9;box-shadow:0 2px 12px #34224618}body.landscape button{min-width:44px;min-height:36px;padding:5px 12px;font-size:18px;border-radius:11px}body.landscape .button-label{display:none}
</style></head>
<body><header><strong>Presentazione da mobile</strong><span>Ruota il telefono in orizzontale per una vista più grande.</span></header>
<main id="screen"><iframe width="1440" height="900" scrolling="no" id="deck" src="presentazione.html" title="Presentazione One Tech" allow="autoplay; fullscreen" allowfullscreen></iframe></main>
<footer aria-label="Controlli presentazione"><button id="prev" aria-label="Indietro" disabled>←<span class="button-label"> Indietro</span></button><button id="next" class="primary" aria-label="Avanti" disabled><span class="button-label">Avanti </span>→</button><button id="restart" aria-label="Ricomincia" disabled>↻<span class="button-label"> Ricomincia</span></button></footer>
<script>
const frame=document.getElementById('deck'),screen=document.getElementById('screen');
function fit(){const r=screen.getBoundingClientRect();if(!r.width||!r.height)return;const landscape=document.body.classList.contains('landscape'),virtualHeight=landscape?1440*r.height/r.width:900,scale=Math.min(r.width/1440,r.height/virtualHeight);frame.style.height=virtualHeight+'px';frame.style.transform='scale('+scale+')';frame.style.left=(r.width-1440*scale)/2+'px';frame.style.top=(r.height-virtualHeight*scale)/2+'px'}
let fitFrame=0,rotationTimers=[];
function viewport(){
 const vv=window.visualViewport,w=vv?.width||document.documentElement.clientWidth,h=vv?.height||innerHeight;
 if(!w||!h)return;
 const style=document.body.style;
 style.setProperty('--app-width',w+'px');style.setProperty('--app-height',h+'px');
 style.setProperty('--app-left',(vv?.offsetLeft||0)+'px');style.setProperty('--app-top',(vv?.offsetTop||0)+'px');
 document.body.classList.toggle('landscape',w>h&&h<=600);
 cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fit);
}
function orientationChanged(){viewport();rotationTimers.forEach(clearTimeout);rotationTimers=[80,250,600].map(delay=>setTimeout(viewport,delay))}
new ResizeObserver(fit).observe(screen);window.addEventListener('resize',viewport);window.addEventListener('orientationchange',orientationChanged);window.addEventListener('pageshow',viewport);window.visualViewport?.addEventListener('resize',viewport);window.visualViewport?.addEventListener('scroll',viewport);viewport();
function nav(dir){const win=frame.contentWindow,action=dir==='forward'?'forward':'backward';if(typeof win[action]==='function')win[action]()}
document.getElementById('next').onclick=()=>nav('forward');document.getElementById('prev').onclick=()=>nav('backward');document.getElementById('restart').onclick=()=>{if(confirm('Ricominciare la presentazione dall’inizio?'))frame.src=frame.getAttribute('src')};frame.onload=()=>{document.querySelectorAll('button').forEach(b=>b.disabled=false);const doc=frame.contentDocument;if(doc){const style=doc.createElement('style');style.id='mobile-crisp-brand';style.textContent='.stage.state-products:not(.world-home):not([class*="zoom-"])>.brand{filter:none!important}.stage.state-products:not(.world-home):not([class*="zoom-"])>.brand>.color-pulse-mark{opacity:1!important;filter:none!important;will-change:auto!important}.stage.state-products:not(.world-home):not([class*="zoom-"])>.brand>.color-pulse-mark path{animation:none!important}.stage.state-products:not(.world-home):not([class*="zoom-"]) .one-inner-light{display:none!important}';doc.head.appendChild(style)}fit()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();nav(e.key==='ArrowRight'?'forward':'backward')}})
</script></body></html>
