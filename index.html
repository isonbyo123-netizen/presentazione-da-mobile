<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0ff"><title>Presentazione da mobile</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#342246;background:#f4f0ff}body{display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}header strong{font-size:17px}header span{font-size:13px;color:#65537d}main{position:relative;flex:1;min-height:0;overflow:hidden;background:white}iframe{position:absolute;width:1440px;height:900px;border:0;transform-origin:0 0}footer{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom));background:#f4f0ff}button{min-height:46px;padding:10px 20px;border:1px solid #c6b5ed;border-radius:12px;font:600 15px Arial;color:#503477;background:white;cursor:pointer}button.primary{background:#6f4dff;color:white;border-color:#6f4dff}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #00bebb;outline-offset:2px}@media(max-height:500px){header{padding:5px 12px}header span{display:none}footer{padding:6px}button{min-height:40px;padding:8px 16px}}@media(max-width:480px){header{flex-direction:column;gap:4px;align-items:flex-start}header span{font-size:12px}footer{gap:8px}button{padding:10px 15px}}</style></head>
<body><header><strong>Presentazione da mobile</strong><span>Per una lettura migliore, ruota il telefono in orizzontale.</span></header>
<main id="screen"><iframe id="deck" src="presentazione.html" title="Presentazione One Tech" allow="autoplay; fullscreen"></iframe></main>
<footer aria-label="Controlli presentazione"><button id="prev" disabled>← Indietro</button><button id="next" class="primary" disabled>Avanti →</button><button id="restart" disabled>Ricomincia</button></footer>
<script>const frame=document.getElementById('deck'),screen=document.getElementById('screen');function fit(){const r=screen.getBoundingClientRect(),scale=Math.min(r.width/1440,r.height/900);frame.style.transform='scale('+scale+')';frame.style.left=(r.width-1440*scale)/2+'px';frame.style.top=(r.height-900*scale)/2+'px'}new ResizeObserver(fit).observe(screen);fit();function nav(dir){const win=frame.contentWindow;if(typeof win[dir==='forward'?'forward':'backward']==='function')win[dir==='forward'?'forward':'backward']()}document.getElementById('next').onclick=()=>nav('forward');document.getElementById('prev').onclick=()=>nav('backward');document.getElementById('restart').onclick=()=>{if(confirm('Ricominciare la presentazione dall’inizio?'))frame.src=frame.getAttribute('src')};frame.onload=()=>document.querySelectorAll('button').forEach(b=>b.disabled=false);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();nav(e.key==='ArrowRight'?'forward':'backward')}});</script></body></html>
