<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0ff"><title>Presentazione da mobile</title>
<style>
*{box-sizing:border-box}html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;position:fixed;left:var(--app-left,0px);top:var(--app-top,0px);width:var(--app-width,100%);height:var(--app-height,100dvh);display:grid;grid-template-columns:calc(64px + env(safe-area-inset-left,0px)) minmax(0,1fr);overflow:hidden;font-family:Arial,sans-serif;background:#f4f0ff;color:#342246}
aside{display:flex;align-items:center;justify-content:center;padding-left:env(safe-area-inset-left,0px);z-index:2}
nav{display:flex;flex-direction:column;gap:9px}
button{width:44px;height:44px;padding:0;border:1px solid #c6b5ed;border-radius:12px;background:white;color:#503477;font:600 21px Arial;cursor:pointer;touch-action:manipulation}
button.primary{background:#6f4dff;color:white;border-color:#6f4dff}button:disabled{opacity:.45}
button:focus-visible{outline:3px solid #00bebb;outline-offset:2px}
main{min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;contain:strict;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px}
#presentationSurface{position:relative;overflow:hidden;contain:strict;background:white;border-radius:10px;box-shadow:0 3px 18px #34224612}
#presentationCanvas{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}iframe{display:block;width:1440px;min-width:1440px;max-width:1440px;height:900px;min-height:900px;max-height:900px;border:0}
</style></head>
<body>
<aside><nav aria-label="Controlli presentazione"><button id="prev" aria-label="Indietro" disabled>←</button><button id="next" class="primary" aria-label="Avanti" disabled>→</button><button id="restart" aria-label="Ricomincia" disabled>↻</button></nav></aside>
<main id="screen"><div id="presentationSurface"><div id="presentationCanvas"><iframe id="deck" width="1440" height="900" scrolling="no" src="presentazione.html?v=replay-2" title="Presentazione One Tech" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div></main>
<script>
const frame=document.getElementById('deck'),screen=document.getElementById('screen'),surface=document.getElementById('presentationSurface'),canvas=document.getElementById('presentationCanvas');
function fit(){
 const r=screen.getBoundingClientRect(),css=getComputedStyle(screen),w=r.width-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight),h=r.height-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom);
 if(w<=0||h<=0)return;
 const scale=Math.min(w/1440,h/900,.5);
 surface.style.width=(1440*scale)+'px';surface.style.height=(900*scale)+'px';
 // Keep the frame at its design size; scale only the surrounding canvas.
 canvas.style.transform='scale('+scale+')';
}
function viewport(){
 const vv=window.visualViewport,w=vv?.width||document.documentElement.clientWidth,h=vv?.height||innerHeight;
 document.body.style.setProperty('--app-width',w+'px');document.body.style.setProperty('--app-height',h+'px');
 document.body.style.setProperty('--app-left',(vv?.offsetLeft||0)+'px');document.body.style.setProperty('--app-top',(vv?.offsetTop||0)+'px');
 requestAnimationFrame(fit);
}
new ResizeObserver(fit).observe(screen);addEventListener('resize',viewport);addEventListener('pageshow',viewport);
visualViewport?.addEventListener('resize',viewport);visualViewport?.addEventListener('scroll',viewport);
addEventListener('orientationchange',()=>{viewport();[80,250,600].forEach(delay=>setTimeout(viewport,delay))});viewport();
function nav(dir){const action=dir==='forward'?'forward':'backward',win=frame.contentWindow;if(typeof win[action]==='function')win[action]()}
document.getElementById('next').onclick=()=>nav('forward');document.getElementById('prev').onclick=()=>nav('backward');
document.getElementById('restart').onclick=()=>{if(confirm('Ricominciare la presentazione dall’inizio?'))frame.src=frame.getAttribute('src')};
frame.onload=()=>{
 document.querySelectorAll('button').forEach(b=>b.disabled=false);
 const doc=frame.contentDocument;if(doc){
  const style=doc.createElement('style');style.id='mobile-crisp-brand';
  style.textContent='.stage.state-products:not(.world-home):not([class*="zoom-"])>.brand{filter:none!important}.stage.state-products:not(.world-home):not([class*="zoom-"])>.brand>.color-pulse-mark{opacity:1!important;filter:none!important;will-change:auto!important}.stage.state-products:not(.world-home):not([class*="zoom-"])>.brand>.color-pulse-mark path{animation:none!important}.stage.state-products:not(.world-home):not([class*="zoom-"]) .one-inner-light{display:none!important}.nav,.hint{display:none!important}';
  doc.head.appendChild(style);
 }fit();
};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();nav(e.key==='ArrowRight'?'forward':'backward')}});
</script><script>const architectureMode=new URLSearchParams(location.search).get('architecture');if(['none','extended'].includes(architectureMode)){const frame=document.getElementById('deck');const url=new URL(frame.getAttribute('src'),location.href);url.searchParams.set('architecture',architectureMode);frame.src=url.href;}</script></body></html>
