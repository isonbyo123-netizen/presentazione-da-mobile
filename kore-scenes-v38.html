// The planted foot counteracts forward translation exactly. Only the swing foot lifts.
const gaitPeriod=.9,gaitSpeed=580/8.5,stance=.56,halfStride=gaitSpeed*gaitPeriod*stance/2;
function poseAdviser(seconds){
 const moving=seconds!==null,phase=moving?(seconds/gaitPeriod)%1:0,bob=moving?-1.2*(1-Math.cos(phase*Math.PI*4))/2:0;
 document.getElementById('adviserTorso').setAttribute('transform','translate(0 '+bob+')');
 for(const [side,hip,offset] of [['Back',6,.5],['Front',-6,0]]){
  const p=(phase+offset)%1;let fx=hip,fy=151;
  if(moving){if(p<stance){fx=halfStride-gaitSpeed*gaitPeriod*p}else{const s=(p-stance)/(1-stance),ease=s*s*(3-2*s);fx=-halfStride+2*halfStride*ease;fy=151-Math.sin(Math.PI*s)*12}}
  const hy=103+bob,dx=fx-hip,dy=fy-hy,d=Math.hypot(dx,dy),bend=Math.sqrt(Math.max(0,27*27-d*d/4)),kx=(hip+fx)/2+dy/d*bend,ky=(hy+fy)/2-dx/d*bend;
  document.getElementById('adviserLeg'+side).setAttribute('d','M'+hip+' '+hy+'L'+kx+' '+ky+'L'+fx+' '+fy);
  document.getElementById('adviserFoot'+side).setAttribute('d','M'+(fx-4)+' '+fy+'H'+(fx+6));
 }
 const swing=moving?Math.sin(phase*Math.PI*2)*9:0;
 document.getElementById('adviserArm').setAttribute('d','M-16 55L'+(-23+swing*.4)+' 79L'+(-26+swing)+' 101');
 document.getElementById('adviserHand').setAttribute('cx',-26+swing);
}
function startAdviserGait(animation){
 function tick(){const elapsed=(Number(animation.currentTime)||0)-2400;if(step!==6)return;
  if(elapsed<0)poseAdviser(null);else if(elapsed>=8500){poseAdviser(null);adviserGaitFrame=0;return}else poseAdviser(elapsed/1000);
  adviserGaitFrame=requestAnimationFrame(tick);
 }adviserGaitFrame=requestAnimationFrame(tick);
}

function render(previous=step){showCase();
clearTimeout(docWalkTimer);docWalk?.cancel();cancelAnimationFrame(adviserGaitFrame);adviserGaitFrame=0;poseAdviser(null);

walkAnimation?.cancel();if(step===6){walkAnimation=document.getElementById('recipient').animate([{transform:'translate(0px,236px)'},{transform:'translate(580px,236px)'}],{duration:8500,delay:2400,fill:'forwards',easing:'linear'});startAdviserGait(walkAnimation);docWalkTimer=setTimeout(()=>{if(step===6)docWalk=doc.animate([{transform:'translate(3585px,563px)'},{transform:'translate(4165px,563px)'}],{duration:8500,fill:'forwards',easing:'linear'})},2400)}
}
let koreMorphCache=null;
function prepareKoreMorph(){
 if(koreMorphCache)return koreMorphCache;
 const video=aeVideos[0];if(video.readyState<2)return null;
 const frame=document.createElement('canvas'),ratio=Math.min(1,(koreMobile?960:1920)/video.videoWidth);
 frame.width=Math.round(video.videoWidth*ratio);frame.height=Math.round(video.videoHeight*ratio);
 const ctx=frame.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,frame.width,frame.height);
 const pixels=ctx.getImageData(0,0,frame.width,frame.height),d=pixels.data;
 let minX=frame.width,minY=frame.height,maxX=0,maxY=0;
 // Extract the already-rendered logo once. No live masks or per-frame drawing.
 for(let y=0;y<frame.height;y++)for(let x=0;x<frame.width;x++){
  const i=(y*frame.width+x)*4,r=d[i],g=d[i+1],b=d[i+2];
  const eligible=b-r>25||Math.max(r,g,b)<180;
  const alpha=eligible?Math.max(0,Math.min(1,(205-g)/70,(200-r)/60)):0;
  d[i+3]=Math.round(alpha*255);
  if(alpha>.5){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}
 }
 if(maxX<=minX)return null;
 ctx.putImageData(pixels,0,0);minX=Math.max(0,minX-3);minY=Math.max(0,minY-3);maxX=Math.min(frame.width,maxX+4);maxY=Math.min(frame.height,maxY+4);
 const logo=document.createElement('canvas');logo.width=maxX-minX;logo.height=maxY-minY;
 logo.getContext('2d').drawImage(frame,minX,minY,logo.width,logo.height,0,0,logo.width,logo.height);
 koreMorphCache={logo,x:minX,y:minY,frameWidth:frame.width,frameHeight:frame.height};
 frame.width=frame.height=1;return koreMorphCache;
}
async function enterWorkflow(){
 pauseAE();busy=true;document.body.classList.add('kore-diving');
 const cached=prepareKoreMorph(),screen=document.getElementById('journeyCanvas');
 const timings={duration:2100,easing:'cubic-bezier(.22,.75,.2,1)',fill:'forwards'},animations=[];
 step=1;render(0);
 // Set the final camera once, before the first visible funnel frame.
 world.style.transition='none';world.getBoundingClientRect();
 const destinationWidth=Math.min(230,innerWidth*.20),destinationX=innerWidth*.94-destinationWidth,destinationY=innerHeight*.07;
 if(cached){
  const factor=Math.max(innerWidth/cached.frameWidth,innerHeight/cached.frameHeight),left=(innerWidth-cached.frameWidth*factor)/2,top=(innerHeight-cached.frameHeight*factor)/2;
  const brand=cached.logo;brand.id='koreMorphBrand';document.body.appendChild(brand);
  Object.assign(brand.style,{left:'0px',top:'0px',width:brand.width+'px',height:brand.height+'px',willChange:'transform,opacity'});
  const sx=left+cached.x*factor,sy=top+cached.y*factor,scale=destinationWidth/brand.width;
  animations.push(brand.animate([
   {transform:'translate('+sx+'px,'+sy+'px) scale('+factor+')',opacity:0},
   {offset:.12,transform:'translate('+sx+'px,'+sy+'px) scale('+factor+')',opacity:1},
   {transform:'translate('+destinationX+'px,'+destinationY+'px) scale('+scale+')',opacity:1}
  ],timings));
 }
 // The background stays put; only the brand moves, while the workflow assembles.
 animations.push(intro.animate([{opacity:1},{offset:.28,opacity:0},{opacity:0}],{...timings,duration:2100}));
 animations.push(screen.animate([{opacity:0,transform:'translateY(20px)'},{offset:.28,opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'translateY(0)'}],timings));
 const engines=[...document.querySelectorAll('#world>.world-engine')];
 engines.forEach((engine,i)=>{
  engine.style.transformBox='fill-box';engine.style.transformOrigin='center';
  animations.push(engine.animate([{opacity:0,transform:'scale(.78)'},{opacity:1,transform:'scale(1)'}],{duration:950,delay:750+i*160,easing:'cubic-bezier(.22,.75,.2,1)',fill:'both'}));
 });
 const flows=[...document.querySelectorAll('#world>path.flow')];
 flows.forEach((path,i)=>animations.push(path.animate([{opacity:0},{opacity:.6}],{duration:700,delay:1150+i*150,fill:'both'})));
 await Promise.all(animations.map(a=>a.finished));
 if(cached){const brand=cached.logo,scale=destinationWidth/brand.width;brand.style.transform='translate('+destinationX+'px,'+destinationY+'px) scale('+scale+')';brand.style.opacity='1';brand.style.willChange='auto';}
 intro.style.visibility='hidden';world.style.transition='';document.body.classList.remove('kore-diving');
 animations.forEach(a=>a.cancel());busy=false;
}
function advance(){if(busy)return;if(step===0){if(introPhase<2)showAEPhase(introPhase+1);else enterWorkflow();return}if(step===6){parent.postMessage({type:'kore-complete'},'*');return}const previous=step;step++;render(previous);busy=true;setTimeout(()=>busy=false,step===3?2850:2250)}
function retreat(){if(busy)return;if(step===0){parent.postMessage({type:'kore-exit'},'*');return}const previous=step;step--;render(previous);if(step===0){document.getElementById('koreMorphBrand')?.remove();intro.getAnimations().forEach(a=>a.cancel());intro.style.visibility='visible';intro.style.transform='none';showAEPhase(2,true);return}busy=true;setTimeout(()=>busy=false,step===0?1200:2250)}

Promise.all([aeMediaReady(aeVideos[0]),document.fonts.ready,...[...document.querySelectorAll('image')].map(el=>{const image=new Image();image.src=el.getAttribute('href');return image.decode().catch(()=>{})})]).then(()=>{parent.postMessage({type:'kore-ready'},'*');if(parent===window)beginKoreAE()});
