<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentazione da PC</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="deck" src="presentazione.html?v=architecture-1" title="Presentazione da PC — One Tech" allow="autoplay; fullscreen" allowfullscreen></iframe><script>const frame=document.getElementById("deck");frame.addEventListener("load",()=>frame.contentWindow.focus());window.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const f=frame.contentWindow[e.key==="ArrowRight"?"forward":"backward"];if(typeof f==="function")f()}});</script><script>if(new URLSearchParams(location.search).get('architecture')==='extended'){const frame=document.getElementById('deck');const url=new URL(frame.getAttribute('src'),location.href);url.searchParams.set('architecture','extended');frame.src=url.href;}</script></body></html>
